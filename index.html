<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME_CENTER - Tienda de Videojuegos</title>
    <!-- Ícono de la pestaña (SVG en línea: evita el error 404 de favicon.ico) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <!-- Enlace CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="assets/css/game.css" />
</head>

<body>

    <!-- ==========================================
         1. BARRA DE NAVEGACIÓN (NAVBAR) RESPONSIVA
         ========================================== -->
    <!-- Hueco de la navbar: la construye crearNavbar() (assets/js/comun.js) desde assets/js/game.js -->
    <div id="zona-navbar"></div>

    <!-- Header / Título Principal -->
    <header id="top" class="bg-primary text-white text-center py-5">
        <div class="container">
            <h1 class="display-4 fw-bold">GAME_CENTER</h1>
            <p class="lead">Tu destino definitivo para encontrar las últimas novedades, consolas y accesorios.</p>
        </div>
    </header>

    <main>

    <!-- CARRUSEL -->
    <section id="carrusel" class="mb-5">
        <div id="gameCarousel" class="carousel slide shadow rounded overflow-hidden">

            <!-- Indicadores y slides: los genera game.js desde assets/data/productos.json -->
            <div class="carousel-indicators" id="carrusel-indicadores"></div>
            <div class="carousel-inner bg-dark" id="carrusel-slides"></div>

            <!-- Botones de Control (Flechas laterales) -->
            <button class="carousel-control-prev" type="button" data-bs-target="#gameCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon bg-dark rounded-circle p-3 shadow" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#gameCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon bg-dark rounded-circle p-3 shadow" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    </section>
    <!-- ==========================================
         3. SECCIÓN DE PRODUCTOS CON CUADRÍCULAS Y TARJETAS (GRID & CARDS)
         ========================================== -->
    <section id="productos">
        <h2 class="text-center mb-4 fw-bold">Productos Destacados</h2>

        <!-- Barra de filtros y buscador: su contenido lo escribe assets/js/game.js -->
        <div id="barra-filtros" class="barra-filtros"></div>

        <!-- Sistema de Cuadrículas Bootstrap (Grid) -->
        <!-- Estado de la carga (cargando / error con acciones) -->
        <div id="zona-estado-productos"></div>

        <!-- Sistema de Cuadrículas Bootstrap (Grid): las tarjetas las genera game.js -->
        <div id="grilla-productos" class="row g-4"></div>

        <!-- Aquí JavaScript avisa cuando el filtro no encuentra productos -->
        <div id="zona-sin-resultados"></div>
    </section>

    <!-- ==========================================
         4. NOVEDADES: el contenido lo genera JavaScript con la Fetch API
         ========================================== -->
    <section id="novedades" class="mt-5">
        <!-- Esta sección se completa desde assets/js/game.js -->
    </section>

    <!-- ==========================================
         5. FORMULARIO DE CONTACTO (validado con JavaScript)
         ========================================== -->
    <section id="contacto" class="mt-5">
        <h2 class="text-center fw-bold mb-4">Escríbenos</h2>

        <form id="form-contacto" class="formulario-contacto" novalidate>
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" />
                <!-- Hueco donde JavaScript escribe el error de este campo -->
                <div class="zona-error" id="error-nombre"></div>
            </div>
            <div>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.cl" />
                <!-- Hueco donde JavaScript escribe el error de este campo -->
                <div class="zona-error" id="error-correo"></div>
            </div>
            <div>
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="¿En qué podemos ayudarte?"></textarea>
                <!-- Hueco donde JavaScript escribe el error de este campo -->
                <div class="zona-error" id="error-mensaje"></div>
            </div>
            <button type="submit" class="btn btn-dark w-100">Enviar consulta</button>
        </form>

        <!-- Aquí JavaScript inserta la confirmación del envío -->
        <div id="resultado-contacto"></div>
    </section>

    </main>

    <!-- ==========================================
         4. PIE DE PÁGINA (FOOTER)
         ========================================== -->
    <!-- Hueco del pie de página: lo construye crearFooter() (assets/js/comun.js) -->
    <div id="zona-footer"></div>

    <!-- ==========================================
         6. PANEL DEL CARRITO (se abre y cierra con JavaScript)
         ========================================== -->
    <aside id="panel-carrito" aria-label="Carrito de compras">
        <div class="panel-cabecera">
            <h2>Tu carrito</h2>
            <button type="button" id="cerrar-carrito" aria-label="Cerrar carrito">&times;</button>
        </div>
        <div id="lista-carrito"></div>
        <p class="panel-total">Total: <span id="total-carrito">$0</span></p>
        <button type="button" id="vaciar-carrito" class="btn btn-outline-light btn-sm w-100">Vaciar carrito</button>
    </aside>

    <!-- Contenedor de los mensajes flotantes que escribe assets/js/comun.js -->
    <div id="contenedor-mensajes"></div>

    <!-- Script de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts propios: primero las funciones compartidas, luego la lógica de la página -->
    <script src="assets/js/comun.js"></script>
    <script src="assets/js/game.js"></script>
</body>

</html>
